name: Qualify photographic surfaces
on:
  push:
    branches: [feat/photographic-surfaces]
    paths: [.github/workflows/photographic-qualify.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [numeric, desktop, mobile, photographic]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: photographic-publication-inputs
          run-id: 35266889060
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs
      - name: Restore checksum-verified candidate
        run: python tools/restore_photographic_candidate.py "$RUNNER_TEMP/inputs"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r tools/requirements-test.txt
      - name: Install Mesa EGL and GLES for native parity
        if: matrix.suite == 'numeric'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri
      - name: Confirm coherent shaders and immutable scene
        run: |
          python tools/build_photographic_shaders.py
          node --check web/app.js
          node --check web/photographic.js
          node --check web/controls.js
          git diff --exit-code -- source/solid_geometry.py source/cybr-geo web/controls.js web/controls.css web/vendor .github
      - name: Run geometry, texture and native material tests
        if: matrix.suite == 'numeric'
        run: |
          python tools/verify.py
          python tools/verify_photographic.py
          python tools/prepare_native_photographic.py
          python tools/test_photographic_field.py
          python tools/make_standalone.py
          python tools/make_standalone.py --compact --out dist/Sandstone_Walk_Compact.html
          python tools/make_standalone.py --legacy --out build/Legacy_Recovery.html
      - name: Install Chromium
        if: matrix.suite != 'numeric'
        run: python -m playwright install --with-deps chromium
      - name: Exercise actual renderer and controls
        if: matrix.suite != 'numeric'
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = desktop ]; then python tools/browser_smoke.py --out build/result;
          elif [ "$SUITE" = mobile ]; then python tools/mobile_controls_smoke.py --out build/result;
          else python tools/test_photographic_browser.py --out build/result; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photographic-${{ matrix.suite }}-verification
          path: |
            build/result/
            build/validation.json
            build/photographic_field/report.json
            evidence/photographic/texture_integrity.json
            dist/*.json
          if-no-files-found: warn
