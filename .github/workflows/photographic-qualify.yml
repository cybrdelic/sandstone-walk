name: Qualify photographic surfaces
on:
  push:
    branches: [feat/photographic-surfaces]
    paths: [.github/workflows/photographic-qualify.yml]
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch checksum-pinned source and completed native bake
        env:
          SOURCE: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0ec0-81f5-96f8-a75d1d62b2e3/raw?se=2026-09-17T19%3A41%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=e69aa6ad-1682-5127-ac9a-3322e5faad0c&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A01%3A53Z&ske=2026-09-18T18%3A01%3A53Z&sks=b&skv=2026-02-06&sig=xpIovU5xN4DwGd5PaVd9M4I%2BDG%2BoTpUysQBSXkFzGFI%3D'
          DATA1: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-3e24-81f5-8d70-ebd2405373ff/raw?se=2026-09-17T19%3A42%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=0c1ae090-b6c3-5324-b1e9-d08b68129e94&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A12%3A37Z&ske=2026-09-18T18%3A12%3A37Z&sks=b&skv=2026-02-06&sig=ZIys7u23ha8UlBG%2BSwIvm53S65kfMSHrB7m3QJc5nNM%3D'
          DATA2: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-e918-81f5-8269-a59295ca8ff3/raw?se=2026-09-17T19%3A42%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=f08fa99b-aa00-5d38-be05-2bd7ec161051&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A12%3A45Z&ske=2026-09-18T18%3A12%3A45Z&sks=b&skv=2026-02-06&sig=Kal9GZzVhtkr%2BKoX1nOavqMRAej/MxpSpLgGmVnQAWs%3D'
          DATA3: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-99a4-81f5-a9e4-2845b31bb756/raw?se=2026-09-17T19%3A43%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=69132d4a-4233-5dd1-ad99-ecd65b8e829e&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A14%3A59Z&ske=2026-09-18T18%3A14%3A59Z&sks=b&skv=2026-02-06&sig=InbECSCXVPcFQKtM4yl65BrgY31MC1BLfUdRmtioKY4%3D'
          DATA4: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-e214-81f5-9e93-e0d06c288cfe/raw?se=2026-09-17T19%3A43%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=7a2025a8-c555-5e8d-a6ff-f54ad8ab9f39&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A21%3A31Z&ske=2026-09-18T18%3A21%3A31Z&sks=b&skv=2026-02-06&sig=Ih7MCXBm/71dCU10QdcdHco%2Bo7zc4p6rfA3G9CA86D4%3D'
        run: |
          python - <<'PY'
          import hashlib,json,os,stat,subprocess,urllib.request,zipfile,shutil
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP']);stage=tmp/'photo-source';stage.mkdir()
          expected={'SOURCE':'ec936167d15f81d9aa60f5a468db22b36ec0f8178535a7eb55c5521c10accacc','DATA1':'5795b2bb48b6bfd5018e8213912574eb277c3a319258a0e81394d24e79edd827','DATA2':'be7ca86bca9a477737d3aa7e1bca69a4f67258cd22082d3d1c8d5ab042115994','DATA3':'b2889d3cc5ef8b49774dc6bcf2e016ec8852df380bc01c6daba2080a9387f265','DATA4':'3119a07b0e95596ef2fcd06165e70e5610eabdec517e991213eb149232d2d4c0'}
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          seen=set()
          for key,wanted in expected.items():
              target=tmp/(key+'.zip');urllib.request.urlretrieve(os.environ[key],target)
              assert sha(target)==wanted,key
              with zipfile.ZipFile(target) as z:
                  for item in z.infolist():
                      path=Path(item.filename)
                      assert not path.is_absolute() and not {'..','.git','.github'}&set(path.parts)
                      assert not stat.S_ISLNK(item.external_attr>>16) and item.filename not in seen
                      seen.add(item.filename)
                  z.extractall(stage)
          source=json.loads((stage/'PHOTO_SOURCE_MANIFEST.json').read_text());data=json.loads((stage/'PHOTO_DATA_MANIFEST.json').read_text())
          for name,h in source['files'].items():assert sha(stage/name)==h,name
          for name,h in data.items():assert sha(stage/name)==h,name
          for name,h in source['base_files'].items():
              if name=='verification.json':
                  assert subprocess.check_output(['git','hash-object',name]).decode().strip()=='87ae5de41cfef1a0f2f3896e001e7f4852407d27'
              else:assert (not Path(name).exists()) if h is None else sha(Path(name))==h,name
          subprocess.run(['git','diff','--exit-code',source['baseline_commit'],'HEAD','--',*source['files']],check=True)
          for name in set(source['files'])|set(data):
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(stage/name,p)
          Path('photo-intake.json').write_text(json.dumps({'source':source,'data':data,'archives':expected},indent=2)+'\n')
          print('PASS: pinned candidate imported without geometry or control replacement')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check topology, optical inputs, CPU-GLES parity and offline reconstruction
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '4'
        run: |
          python -m pip install -r tools/requirements-test.txt
          python tools/build_photographic_shaders.py
          python tools/verify.py
          python tools/verify_photographic.py
          python tools/prepare_native_photographic.py
          python tools/test_photographic_field.py
          node --check web/app.js
          node --check web/photographic.js
          node --check web/bootstrap.js
          python tools/make_standalone.py
          python tools/make_standalone.py --compact --out dist/Sandstone_Walk_Compact.html
          python tools/make_standalone.py --legacy --out build/Legacy_Recovery.html
          git diff --exit-code -- source/solid_geometry.py source/cybr-geo web/controls.js web/controls.css web/vendor .github
      - name: Check complete moving-frame evidence and preserve candidate
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          m=json.loads(Path('evidence/photographic/film.json').read_text())
          assert len(m['frames'])==96 and len({f['sha256'] for f in m['frames']})==96 and m['gif_unique_frames']==48
          for p,h in m['files'].items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h
          for p,h in m['shader_hashes'].items():assert hashlib.sha256((Path('web')/p).read_bytes()).hexdigest()==h
          shutil.copyfile('build/photographic_field/report.json','evidence/photographic/ci_native_glsl_parity.json')
          shutil.copyfile('dist/Sandstone_Walk_Standalone.json','evidence/photographic/standalone.json')
          shutil.copyfile('dist/Sandstone_Walk_Compact.json','evidence/photographic/compact.json')
          dst=Path(os.environ['RUNNER_TEMP'])/'photographic-candidate.zip'
          with zipfile.ZipFile(dst,'w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for p in Path('.').rglob('*'):
                  if not p.is_file() or p.parts[0] in ['.git','build','dist'] or '__pycache__' in p.parts:continue
                  z.write(p,p.as_posix())
          (dst.parent/'photographic-candidate.sha256').write_text(hashlib.sha256(dst.read_bytes()).hexdigest()+'  photographic-candidate.zip\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: photographic-candidate
          compression-level: 0
          retention-days: 3
          path: |
            ${{ runner.temp }}/photographic-candidate.zip
            ${{ runner.temp }}/photographic-candidate.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photographic-numeric-verification
          path: |
            build/validation.json
            build/photographic_field/report.json
            evidence/photographic/texture_integrity.json
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [desktop, mobile, photographic]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: photographic-candidate
          path: ${{ runner.temp }}/candidate
      - name: Restore candidate bytes
        run: |
          cd "$RUNNER_TEMP/candidate" && sha256sum --check photographic-candidate.sha256
          python -m zipfile -e "$RUNNER_TEMP/candidate/photographic-candidate.zip" "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Chromium and dependencies
        run: |
          python -m pip install -r tools/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Exercise actual Three.js renderer
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = desktop ]; then python tools/browser_smoke.py --out build/result;
          elif [ "$SUITE" = mobile ]; then python tools/mobile_controls_smoke.py --out build/result;
          else python tools/test_photographic_browser.py --out build/result; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photographic-${{ matrix.suite }}-verification
          path: build/result/
          if-no-files-found: warn
  publish:
    needs: [prepare, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: photographic-candidate
          path: ${{ runner.temp }}/candidate
      - name: Restore tested candidate
        run: |
          cd "$RUNNER_TEMP/candidate" && sha256sum --check photographic-candidate.sha256
          python -m zipfile -e "$RUNNER_TEMP/candidate/photographic-candidate.zip" "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          pattern: photographic-*-verification
          path: evidence/photographic/ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify browser outcomes and commit only tested files
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          reports={}
          for name in ['desktop','mobile','photographic']:
              p=Path('evidence/photographic/ci')/('photographic-'+name+'-verification')/'report.json'
              r=json.loads(p.read_text());assert r['result']=='PASS' and not r['errors'],name
              assert r.get('browser_runtime_verified',r.get('scene_rendering_verified')) is True,name
              reports[name]=r
          r=reports['photographic'];assert r['export']['size']==[3840,2560] and max(r['actual_texture_texel_errors'])<=1
          proof={'result':'PASS','run_id':os.environ['GITHUB_RUN_ID'],'source_input_commit':os.environ['GITHUB_SHA'],
              'native_bake':'Executed locally; compiled optical inputs and results hash-verified before these independent browser tests',
              'browser_runtime_verified':True,'geometry_unchanged':True,'controls_unchanged':True,
              'physical_phone_benchmark':False,'render_export_pixels':[3840,2560],'screen_density_test_pixels':[780,1688],
              'texture_base':4096,'explicit_mip_levels':13,'compact_texture_base':2048,'browser_reports':{k:v['result'] for k,v in reports.items()}}
          Path('evidence/photographic/qualified_ci.json').write_text(json.dumps(proof,indent=2)+'\n')
          intake=json.loads(Path('photo-intake.json').read_text());paths=sorted(set(intake['source']['files'])|set(intake['data']))
          subprocess.run(['git','add','-f','--',*paths,'evidence/photographic'],check=True)
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          skip={'SHA256SUMS.json','.github/workflows/photographic-intake.yml','.github/workflows/photographic-qualify.yml'}
          hashes={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in sorted(names) if n and n not in skip and Path(n).is_file()}
          Path('SHA256SUMS.json').write_text(json.dumps(hashes,indent=2)+'\n');subprocess.run(['git','add','SHA256SUMS.json'],check=True)
          PY
          python tools/check_manifest.py
          git diff --cached --exit-code -- source/solid_geometry.py source/cybr-geo web/controls.js web/controls.css web/vendor .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add verified photographic 4K surfaces, explicit mips, native DPR, fresh spectral bake and full-mesh sun detail'
          git push origin HEAD:feat/photographic-surfaces
          echo "QUALIFIED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish current full and compact downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/make_standalone.py
          python tools/make_standalone.py --compact --out dist/Sandstone_Walk_Compact.html
          git archive --format=zip HEAD -- . ':!.github/workflows/photographic-intake.yml' ':!.github/workflows/photographic-qualify.yml' > dist/Sandstone_Walk_Project.zip
          sha256sum dist/*.html dist/*.zip > dist/SHA256SUMS.txt
          gh release create v0.5.0 --target "$QUALIFIED_COMMIT" --title 'Sandstone Walk 0.5.0 — Photographic 4K surfaces' --notes-file docs/RELEASE_NOTES.md --latest
          gh release upload v0.5.0 dist/Sandstone_Walk_Standalone.html dist/Sandstone_Walk_Compact.html dist/Sandstone_Walk_Project.zip dist/Sandstone_Walk_Standalone.json dist/Sandstone_Walk_Compact.json dist/SHA256SUMS.txt
