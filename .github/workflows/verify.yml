name: Verify scene and browser
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [numeric, desktop, mobile, photographic]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/requirements-test.txt
      - name: Check manifest and shader generation
        run: |
          python tools/check_manifest.py
          python tools/build_photographic_shaders.py
          git diff --exit-code -- web/bootstrap.js web/surface.vert.glsl web/surface.frag.glsl
          node --check web/app.js
          node --check web/photographic.js
          node --check web/controls.js
      - name: Numeric and optical input verification
        if: matrix.suite == 'numeric'
        run: |
          python tools/verify.py
          python tools/verify_photographic.py
          python tools/prepare_native_photographic.py
          python tools/test_photographic_field.py
          python tools/make_standalone.py
          python tools/make_standalone.py --compact --out dist/Sandstone_Walk_Compact.html
          python tools/make_standalone.py --legacy --out build/Legacy_Recovery.html
      - name: Install browser
        if: matrix.suite != 'numeric'
        run: python -m playwright install --with-deps chromium
      - name: Actual renderer and controls
        if: matrix.suite != 'numeric'
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = desktop ]; then python tools/browser_smoke.py --out build/result;
          elif [ "$SUITE" = mobile ]; then python tools/mobile_controls_smoke.py --out build/result;
          else python tools/test_photographic_browser.py --out build/result; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandstone-${{ matrix.suite }}-verification
          path: |
            build/result/
            build/validation.json
            build/photographic_field/report.json
            evidence/photographic/texture_integrity.json
            dist/*.json
          if-no-files-found: warn
