name: Verify scene and browser
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r tools/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Check immutable scene buffers and shader identity
        run: |
          python tools/check_manifest.py
          python tools/build_material_shaders.py
          git diff --exit-code -- web/bootstrap.js web/surface.vert.glsl web/surface.frag.glsl
          python tools/verify.py
          node --check web/app.js
          node --check web/bootstrap.js
          node --check web/controls.js
          python tools/make_standalone.py
      - name: Validate shared CPU and GLSL material sampling
        run: python tools/test_material_field.py
      - name: Run real Three.js browser test
        run: python tools/browser_smoke.py
      - name: Test mobile multi-touch and orbit controls
        run: python tools/mobile_controls_smoke.py
      - name: Test scene and material from multiple browser cameras
        run: python tools/test_solid_browser.py --materials --out build/solid_browser
      - name: Preserve validation and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandstone-walk-verification
          path: |
            build/material-field/report.json
            build/validation.json
            build/browser/
            build/mobile/
            build/solid_browser/
            dist/Sandstone_Walk_Standalone.json
          if-no-files-found: error
