name: Finalize independently verified detail delivery
on:
  push:
    branches: [feat/scanned-surface-detail]
    paths: [.github/workflows/detail-finalize.yml]
permissions:
  contents: write
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      SW_HEADLESS: '0'
      SW_ANGLE: gl
      ANGLE_BACKEND: gl
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: detail-review-candidate
          path: ${{ runner.temp }}/candidate
          run-id: 35278636289
          github-token: ${{ github.token }}
      - name: Restore unchanged render candidate and the corrected capture test
        run: |
          cd "$RUNNER_TEMP/candidate" && sha256sum --check candidate.sha256
          python -m zipfile -e "$RUNNER_TEMP/candidate/candidate.zip" "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git show HEAD:tools/test_detail_standalone.py > tools/test_detail_standalone.py
          git show HEAD:.github/workflows/verify.yml > .github/workflows/verify.yml
          git diff --exit-code -- .github tools/test_detail_standalone.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser and test dependencies
        run: |
          python -m pip install -r tools/requirements-test.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1
      - name: Verify identical full and compact deliveries with same-task real-canvas capture
        run: |
          python tools/verify_detail.py
          python tools/make_standalone.py
          python tools/make_standalone.py --texture-size 2048 --out dist/Sandstone_Walk_Compact.html
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          for tier,name in [('full','Sandstone_Walk_Standalone'),('compact','Sandstone_Walk_Compact')]:
              before=json.loads(Path('evidence/detail/standalone_'+tier+'.json').read_text())
              actual=json.loads(Path('dist/'+name+'.json').read_text())
              assert before['sha256']==actual['sha256'] and before['bytes']==actual['bytes']
          PY
          xvfb-run -a python tools/test_detail_standalone.py
      - name: Require the original parallel detail and legacy regression jobs to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 35278636289 --interval 15 --exit-status || true
          gh api repos/cybrdelic/sandstone-walk/actions/runs/35278636289/jobs --jq '[.jobs[]|{name,conclusion}]' > "$RUNNER_TEMP/original-jobs.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          jobs={j['name']:j['conclusion'] for j in json.loads((Path(os.environ['RUNNER_TEMP'])/'original-jobs.json').read_text())}
          for name in ['prepare','browser (detail)','browser (regressions)']:assert jobs[name]=='success',(name,jobs)
          print('PASS: original scene, detail and input regressions; initial standalone capture failure is not counted as a pass')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: detail-detail-verification
          path: build/qualified/detail
          run-id: 35278636289
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: detail-regressions-verification
          path: build/qualified/regressions
          run-id: 35278636289
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: detail-standalone-verification
          path: build/initial-offline
          run-id: 35278636289
          github-token: ${{ github.token }}
      - name: Verify reports, images and preserved source geometry
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          root=Path('build/qualified');out=Path('evidence/detail')
          detail=json.loads((root/'detail/evidence/detail/report.json').read_text())
          assert detail['result']=='PASS' and not detail['errors'] and detail['entrypoint']=='localhost HTTP'
          assert detail['geometry']=={'triangles':5029800,'vertices':2526592} and detail['detail']['resolution']==4096
          assert len(detail['checks'])>=63 and len(detail['captures'])==16
          assert detail['captures']['native_dpr3']['size']==[1170,2532]
          assert detail['export4k']['report']['width']==3840 and detail['export4k']['report']['height']==2560 and not detail['export4k']['report']['upscaled']
          assert detail['actual_fragment_sha256']=='b496f4df5699889455eadbde456a145a93847809b825c102ad2ebbdac6c97ddb'
          for name,entry in detail['captures'].items():assert hashlib.sha256((root/'detail/evidence/detail'/(name+'.png')).read_bytes()).hexdigest()==entry['sha256'],name
          shutil.copytree(root/'detail/evidence/detail',out,dirs_exist_ok=True)
          for p in (root/'detail/media').iterdir():shutil.copyfile(p,Path('media')/p.name)
          media=json.loads((out/'media.json').read_text());assert media['result']=='PASS' and media['gif_distinct_frames']==48
          for name,digest in media['files'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          reg=root/'regressions/build'
          for folder in ['browser','mobile','solid_browser','material-field']:
              report=json.loads((reg/folder/'report.json').read_text());assert report['result']=='PASS' and not report.get('errors'),folder
              if folder=='mobile':assert report['scene_rendering_verified'] and not report['controls_only']
              dest=out/'regression'/folder;dest.mkdir(parents=True,exist_ok=True);shutil.copyfile(reg/folder/'report.json',dest/'report.json')
          sr=Path('build/detail-standalone');report=json.loads((sr/'report.json').read_text())
          assert report['result']=='PASS' and not report['errors'] and len(report['deliveries'])==2
          for entry in report['deliveries']:
              assert not entry['external_requests'] and not entry['asset_requests'] and entry['state']['glError']==0
              assert hashlib.sha256((Path('dist')/entry['filename']).read_bytes()).hexdigest()==entry['sha256']
          shutil.copytree(sr,out/'offline',dirs_exist_ok=True)
          shutil.copyfile('build/initial-offline/build/detail-standalone/report.json',out/'initial_offline_capture_failure.json')
          (out/'qualified_ci.json').write_text(json.dumps({'result':'PASS','run_id':os.environ['GITHUB_RUN_ID'],'input_commit':os.environ['GITHUB_SHA'],
              'render_and_regression_run_id':35278636289,'source_mesh_sha256':detail['source_mesh_sha256'],'renderer':detail['renderer'],
              'browser_http_entrypoint_verified':True,'full_and_compact_standalone_verified':True,'original_geometry_bake_and_controls_unchanged':True,
              'photographic_materials':'Original CC0 maps, not image generation','fresh_spectral_bake':False,'physical_phone_benchmark':False,
              'source_intake_run_id':35278285973,'offline_capture_correction':'Encode actual canvas in the draw task before default framebuffer discard; runtime files unchanged'},indent=2)+'\n')
          PY
      - name: Commit only independently qualified delivery
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          names=list(json.loads(Path('evidence/detail/source_intake.json').read_text())['files'])
          names+=['web/detail','web/scene.json','web/bootstrap.js','evidence/detail','evidence/solid_validation.json','media/sandstone-detail.gif','media/sandstone-detail.mp4']
          subprocess.run(['git','add','-f','--',*names],check=True)
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          omit={'SHA256SUMS.json','.github/workflows/detail-workspace.yml','.github/workflows/detail-intake.yml','.github/workflows/detail-qualify.yml','.github/workflows/detail-finalize.yml'}
          result={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sorted(paths) if name and name not in omit and Path(name).is_file()}
          Path('SHA256SUMS.json').write_text(json.dumps(result,indent=2)+'\n');subprocess.run(['git','add','SHA256SUMS.json'],check=True)
          PY
          python tools/check_manifest.py
          git diff --cached --exit-code -- web/assets source/cybr-geo source/solid_geometry.py source/material_field.glsl web/vendor web/controls.js web/controls.css 'web/*.glsl' media/sandstone-walk.gif media/sandstone-walk.mp4 .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Deliver 4K photographic surfaces, native screen pixels, linear-HDR AA and verified full/compact offline viewers'
          git push origin HEAD:feat/scanned-surface-detail
          echo "QUALIFIED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish exact tested files and complete source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip HEAD -- . ':!.github/workflows/detail-workspace.yml' ':!.github/workflows/detail-intake.yml' ':!.github/workflows/detail-qualify.yml' ':!.github/workflows/detail-finalize.yml' > dist/Sandstone_Walk_Project.zip
          sha256sum dist/*.html dist/Sandstone_Walk_Project.zip > dist/SHA256SUMS.txt
          gh release create v0.5.0 --target "$QUALIFIED_COMMIT" --title 'Sandstone Walk 0.5.0 — Photographic detail and native resolution' --notes-file docs/RELEASE_NOTES.md --latest
          gh release upload v0.5.0 dist/Sandstone_Walk_Standalone.html dist/Sandstone_Walk_Compact.html dist/Sandstone_Walk_Project.zip dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-finalized-verification
          retention-days: 7
          path: |
            build/detail-standalone/
            evidence/detail/qualified_ci.json
            dist/*.json
          if-no-files-found: warn
