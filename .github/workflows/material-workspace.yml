name: Surface mapping workspace
on:
  push:
    branches: [fix/surface-mapping]
    paths: [.github/workflows/material-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive the exact working tree
        run: |
          git archive --format=zip HEAD -o "$RUNNER_TEMP/material-workspace.zip"
          sha256sum "$RUNNER_TEMP/material-workspace.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: material-workspace
          path: ${{ runner.temp }}/material-workspace.zip
          compression-level: 0
          retention-days: 2
