name: Finalize verified publication
on:
  push:
    branches: [master]
    paths: ['.github/workflows/publication-finalize.yml']
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm the tested code and successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/cybrdelic/sandstone-walk/actions/runs/35184213934 --jq .conclusion)" = success
          git diff --exit-code d882dd600cf791ae9a21470146edde5d742784e3 HEAD -- web source tools index.html
      - uses: actions/download-artifact@v4
        with:
          name: sandstone-walk-verification
          path: build/qualified
          run-id: 35184213934
          github-token: ${{ github.token }}
      - name: Verify captures and refresh publication evidence
        run: |
          python - <<'PY'
          import hashlib,json,shutil,subprocess
          from pathlib import Path
          root=Path.cwd()
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          manifest=json.loads(Path('SHA256SUMS.json').read_text())
          for name,expected in manifest.items():
              if name=='tools/browser_smoke.py':
                  expected='cb49f3148ab825afe25d0ab23ff5cbbf50580e7b148c04793901fc82d70a8973'
              assert sha(Path(name))==expected,name
          source=Path('build/qualified/browser')
          report=json.loads((source/'report.json').read_text())
          assert report['result']=='PASS' and report['browser_runtime_verified'] is True
          assert report['errors']==[] and all(report['controls'].values())
          assert report['geometry']['triangles']==8108728
          assert report['geometry']['vertices']==4072674
          for name,entry in report['captures'].items():
              assert sha(source/(name+'.png'))==entry['sha256']
              assert entry['gl_error']==0 and entry['drawn_triangles']==8108728
              assert entry['size']==[1200,800]
          dest=Path('evidence/browser_ci');dest.mkdir(exist_ok=True)
          old=dest/'report.json'
          if old.exists() and not json.loads(old.read_text()).get('browser_runtime_verified'):
              shutil.copyfile(old,dest/'initial_compositor_timeout.json')
          for p in source.iterdir():shutil.copyfile(p,dest/p.name)
          shutil.copyfile('build/qualified/validation.json','evidence/ci_geometry_validation.json')
          shutil.copyfile('evidence/publication_ci.json','evidence/publication_ci_initial.json')
          Path('evidence/publication_ci.json').write_text(json.dumps({
              'schema':'sandstone-walk-qualified-publication/1','result':'PASS',
              'tested_commit':'d882dd600cf791ae9a21470146edde5d742784e3',
              'tested_runtime_source_unchanged':True,'run_id':35184213934,
              'artifact_id':10481343115,'browser':report,
              'native_preview_media_unchanged':True,
              'offline_viewer_sha256':'0e49826210de340ddb6c45110fa833bad3d69efa6ae08124799e1aa03c523ade'
          },indent=2)+'\n')
          readme=Path('README.md');text=readme.read_text()
          marker='GitHub Actions runs the separate browser test on its own runner; its workflow result is the authority for that execution.'
          assert marker in text
          text=text.replace(marker,'The separate Chromium / Three.js WebGL2 test has now **passed on GitHub Actions**: all 8,108,728 triangles loaded and drew, three 1200 x 800 canvas captures completed with zero GL errors, and keyboard movement, camera poses, reference reset and lighting-mode switching passed. See the [browser report](evidence/browser_ci/report.json), [browser hero capture](evidence/browser_ci/hero.png), and [successful run](https://github.com/cybrdelic/sandstone-walk/actions/runs/35184213934). The test pauses between completed frames to capture the real browser canvas reliably on a software-GPU runner; it does not replace the renderer or its pixels.')
          text=text.replace('python -m pip install playwright\n','python -m pip install -r tools/requirements-test.txt\n')
          readme.write_text(text)
          package=Path('package.json');data=json.loads(package.read_text());data['version']='0.1.1';package.write_text(json.dumps(data,indent=2)+'\n')
          notes=Path('docs/RELEASE_NOTES.md');text=notes.read_text().replace('# Sandstone Walk 0.1.0','# Sandstone Walk 0.1.1',1)
          text=text.replace('Initial publication of the native surface-bake recovery as a ready-to-serve Three.js project.','Verified publication of the native surface-bake recovery as a ready-to-serve Three.js project. This packaging update includes passing Chromium canvas captures and controls tests; geometry, baked lighting, viewer shaders, GIF and MP4 are unchanged.')
          notes.write_text(text)
          names=set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))
          names.update(str(p.as_posix()) for p in Path('evidence').rglob('*') if p.is_file())
          names.discard('');names.discard('SHA256SUMS.json');names.discard('.github/workflows/publication-finalize.yml')
          manifest={name:sha(Path(name)) for name in sorted(names) if Path(name).is_file()}
          Path('SHA256SUMS.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('PASS:',len(manifest),'publication hashes; actual Chromium capture and controls report verified')
          PY
          python tools/check_manifest.py
          python tools/make_standalone.py
      - name: Commit verified public evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f README.md package.json docs/RELEASE_NOTES.md SHA256SUMS.json evidence/browser_ci evidence/publication_ci.json evidence/publication_ci_initial.json evidence/ci_geometry_validation.json
          git diff --cached --exit-code -- web source .github
          git commit -m 'Complete publication with passing Chromium captures, controls checks and preserved scene hashes'
          git push origin HEAD:master
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish qualified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip HEAD -- . ':!.github/workflows/publication-finalize.yml' > dist/Sandstone_Walk_Project.zip
          sha256sum dist/Sandstone_Walk_Standalone.html dist/Sandstone_Walk_Project.zip > dist/SHA256SUMS.txt
          gh release create v0.1.1 --target "$FINAL_COMMIT" --title 'Sandstone Walk 0.1.1' --notes-file docs/RELEASE_NOTES.md --latest
          gh release upload v0.1.1 dist/Sandstone_Walk_Standalone.html dist/Sandstone_Walk_Project.zip dist/SHA256SUMS.txt
