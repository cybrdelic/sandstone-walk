name: Verify closed-landform correction
on:
  push:
    branches: [fix/closed-landform-geometry]
    paths: ['.github/workflows/solid-import.yml']
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-pinned source and completed native bake
        env:
          CODE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-eae4-81f5-98e9-05ec5b07b4d3/raw?se=2026-09-17T16%3A23%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=ff91812b-0989-5c01-b14a-de4af46d9783&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T02%3A35%3A56Z&ske=2026-09-18T02%3A35%3A56Z&sks=b&skv=2026-02-06&sig=Xge7kzlin1UEz3kb/z0Dh5gHSh1DDX36ys/OBCgkQ%2Bk%3D'
          DATA_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-bb74-81f5-b42a-200775003612/raw?se=2026-09-17T16%3A23%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=32404b18-8d14-5ce1-bd9c-c31f3604b3c0&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T11%3A24%3A51Z&ske=2026-09-18T11%3A24%3A51Z&sks=b&skv=2026-02-06&sig=DA6xuRrRbTsgTIRt8EvJvVJyHTTs9GkUlqczJb2au4o%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --silent --show-error "$CODE_URL" -o "$RUNNER_TEMP/code.zip"
          curl --fail --location --retry 2 --silent --show-error "$DATA_URL" -o "$RUNNER_TEMP/data.zip"
          echo "77d8f490664ef65bf3376d686750f5fcb4f88639dda05b99f76eb2561041b696  $RUNNER_TEMP/code.zip" | sha256sum --check
          echo "3823f7d8cb190b4160bbd049af0fd2e4ae2611aab436e8b53e97a1d48589177a  $RUNNER_TEMP/data.zip" | sha256sum --check
      - name: Extract verified files and preserve the original scene before replacement
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,stat,subprocess,zipfile
          from pathlib import Path
          root=Path.cwd().resolve();temp=Path(os.environ['RUNNER_TEMP']);stage=temp/'solid-stage';stage.mkdir()
          records={}
          for name,manifest in [('code','SOLID_CODE_MANIFEST.json'),('data','SOLID_DATA_MANIFEST.json')]:
              with zipfile.ZipFile(temp/(name+'.zip')) as z:
                  members=z.infolist()
                  if len({m.filename for m in members})!=len(members):raise ValueError('Duplicate archive path')
                  for m in members:
                      p=Path(m.filename)
                      if p.is_absolute() or '..' in p.parts or '.git' in p.parts or '.github' in p.parts:raise ValueError('Unsafe archive path')
                      if stat.S_ISLNK(m.external_attr>>16):raise ValueError('Archive symlinks not accepted')
                      if not (stage/p).resolve().is_relative_to(stage):raise ValueError('Path escapes stage')
                  z.extractall(stage)
              expected=json.loads((stage/manifest).read_text())
              for path,wanted in expected.items():
                  p=(stage/path).resolve()
                  if not p.is_relative_to(stage) or hashlib.sha256(p.read_bytes()).hexdigest()!=wanted:raise ValueError('Input file hash mismatch: '+path)
              records[name]=expected
          # The integration helper snapshots the old manifest before new assets enter.
          shutil.copyfile(stage/'tools/integrate_solid.py',root/'tools/integrate_solid.py')
          subprocess.run(['python','tools/integrate_solid.py','prepare'],check=True)
          for expected in records.values():
              for path in expected:
                  p=root/path;p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(stage/path,p)
          shutil.copytree(root/'evidence/browser',root/'evidence/local_solid_browser')
          (root/'evidence/publication_inputs.json').write_text(json.dumps({'schema':'sandstone-walk-solid-intake/1',
              'purpose':'Hashes of imported source and local bake/media before integration and CI refresh; not the current whole-tree manifest',
              'code_archive_sha256':'77d8f490664ef65bf3376d686750f5fcb4f88639dda05b99f76eb2561041b696',
              'data_archive_sha256':'3823f7d8cb190b4160bbd049af0fd2e4ae2611aab436e8b53e97a1d48589177a','input_files':records},indent=2)+'\n')
          (temp/'imported-paths.json').write_text(json.dumps(sorted(set(records['code'])|set(records['data']))))
          report=json.loads((root/'evidence/geometry_report.json').read_text())
          assert hashlib.sha256((root/'source/solid_geometry.py').read_bytes()).hexdigest()==report['source_file_sha256']
          bake=json.loads((root/'evidence/bake_inputs.json').read_text())
          assert bake['capture_phase']=='before_native_bake'
          for name in ['solid_bake.cpp','transport_bake.cpp']:
              assert hashlib.sha256((root/'source'/name).read_bytes()).hexdigest()==bake['files'][name]['sha256']
          print('PASS: source and generated geometry/bake identities verified; original assets retained')
          PY
          git diff --exit-code -- source/cybr-geo source/bake.cpp source/resolve.py source/transport_bake.cpp source/three.bundle.js web/vendor web/controls.css 'web/*.glsl' .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: |
          python -m pip install -r tools/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Validate actual closed topology, arrays and both standalone paths
        run: |
          python tools/verify.py
          node --check web/app.js
          node --check web/bootstrap.js
          node --check web/controls.js
          python tools/make_standalone.py
          python tools/make_standalone.py --legacy --out build/Legacy_Recovery.html
      - name: Preserve desktop Chromium regression
        run: python tools/browser_smoke.py
      - name: Preserve mobile multi-touch and orbit regression
        run: python tools/mobile_controls_smoke.py
      - name: Render the regenerated canyon from multiple actual browser cameras
        run: python tools/test_solid_browser.py
      - name: Require all results and finalize public documentation
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          desktop=json.loads(Path('build/browser/report.json').read_text())
          mobile=json.loads(Path('build/mobile/report.json').read_text())
          browser=json.loads(Path('evidence/browser/report.json').read_text())
          assert desktop['result']=='PASS' and desktop['browser_runtime_verified'] and not desktop['errors']
          assert mobile['result']=='PASS' and mobile['scene_rendering_verified'] and not mobile['controls_only'] and not mobile['errors']
          assert browser['result']=='PASS' and browser['browser_runtime_verified'] and not browser['errors']
          assert len(browser['captures'])==6
          for r in browser['captures'].values():assert r['gl_error']==0 and r['triangles_drawn']==5029800
          m=json.loads(Path('evidence/solid_media.json').read_text())
          assert m['source_mesh_sha256']==browser['source_mesh_sha256'] and len(m['frames'])==144 and m['gif_unique_frames']==72
          for path,wanted in m['files'].items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==wanted
          out=Path('evidence/solid_ci');out.mkdir(exist_ok=True)
          shutil.copytree('build/browser',out/'desktop',dirs_exist_ok=True)
          shutil.copytree('build/mobile',out/'mobile',dirs_exist_ok=True)
          shutil.copyfile('dist/Sandstone_Walk_Standalone.json',out/'standalone.json')
          (out/'execution.json').write_text(json.dumps({'result':'PASS','run_id':os.environ['GITHUB_RUN_ID'],
              'tested_input_commit':os.environ['GITHUB_SHA'],'browser_entrypoint':'Actual split Three.js application via localhost HTTP',
              'source_mesh_sha256':browser['source_mesh_sha256'],'native_bake':'Executed locally before import; immutable inputs and results verified here',
              'media':'Actual native GLES moving-camera render, not a browser recording','physical_phone_benchmark':False},indent=2)+'\n')
          PY
          python tools/integrate_solid.py finalize
      - name: Commit only the qualified source, bake, media and evidence
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          names=json.loads((Path(os.environ['RUNNER_TEMP'])/'imported-paths.json').read_text())
          extra=['source/legacy_v0_2','tools/verify.py','tools/make_standalone.py','tools/browser_smoke.py','tools/mobile_controls_smoke.py','tools/requirements-test.txt','package.json','README.md','docs/RELEASE_NOTES.md','docs/ARCHITECTURE.md','docs/REPRODUCING.md','evidence']
          subprocess.run(['git','add','-f','--',*names,*extra],check=True)
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          manifest={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in sorted(tracked) if p and p not in ['SHA256SUMS.json','.github/workflows/solid-import.yml'] and Path(p).is_file()}
          Path('SHA256SUMS.json').write_text(json.dumps(manifest,indent=2)+'\n')
          subprocess.run(['git','add','SHA256SUMS.json'],check=True)
          PY
          python tools/check_manifest.py
          git diff --cached --exit-code -- source/cybr-geo source/bake.cpp source/resolve.py source/transport_bake.cpp source/three.bundle.js web/vendor web/controls.css 'web/*.glsl' .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace thin canyon stage with closed landform, rough joint-cut rocks and a fresh verified spectral bake'
          git push origin HEAD:fix/closed-landform-geometry
          echo "QUALIFIED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish versioned downloads of the tested correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/make_standalone.py
          git archive --format=zip HEAD -- . ':!.github/workflows/solid-import.yml' > dist/Sandstone_Walk_Project.zip
          sha256sum dist/Sandstone_Walk_Standalone.html dist/Sandstone_Walk_Project.zip > dist/SHA256SUMS.txt
          gh release create v0.3.0 --target "$QUALIFIED_COMMIT" --title 'Sandstone Walk 0.3.0 — Closed landform' --notes-file docs/RELEASE_NOTES.md --latest
          gh release upload v0.3.0 dist/Sandstone_Walk_Standalone.html dist/Sandstone_Walk_Project.zip dist/Sandstone_Walk_Standalone.json dist/SHA256SUMS.txt
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-landform-verification
          path: |
            build/validation.json
            build/browser/
            build/mobile/
            evidence/browser/
            evidence/solid_validation.json
            evidence/solid_ci/
            dist/Sandstone_Walk_Standalone.json
          if-no-files-found: warn
