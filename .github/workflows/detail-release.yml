name: Release qualified photographic-detail renderer
on:
  push:
    branches: [feat/scanned-surface-detail]
    paths: [.github/workflows/detail-release.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require completed independent qualifications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 35279262293 --interval 15 --exit-status || true
          gh run watch 35279475963 --interval 15 --exit-status
          gh api repos/cybrdelic/sandstone-walk/actions/runs/35278636289/jobs --jq '[.jobs[]|{name,conclusion}]' > "$RUNNER_TEMP/detail-jobs.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['RUNNER_TEMP'])/'detail-jobs.json').read_text())
          jobs={r['name']:r['conclusion'] for r in rows}
          assert jobs['prepare']=='success' and jobs['browser (detail)']=='success',jobs
          print('PASS: source, topology, real HTTP detail rendering and repaired navigation qualification')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: detail-review-candidate
          path: ${{ runner.temp }}/candidate
          run-id: 35278636289
          github-token: ${{ github.token }}
      - name: Restore exact render candidate and reviewed permanent testing configuration
        run: |
          cd "$RUNNER_TEMP/candidate" && sha256sum --check candidate.sha256
          python -m zipfile -e "$RUNNER_TEMP/candidate/candidate.zip" "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git show HEAD:tools/test_detail_standalone.py > tools/test_detail_standalone.py
          git show HEAD:.github/workflows/verify.yml > .github/workflows/verify.yml
          git diff --exit-code -- .github tools/test_detail_standalone.py
      - uses: actions/download-artifact@v4
        with:
          name: detail-detail-verification
          path: build/qualified/detail
          run-id: 35278636289
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: detail-navigation-verification
          path: build/qualified/regressions
          run-id: 35279475963
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: detail-finalized-verification
          path: build/qualified/offline
          run-id: 35279262293
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: detail-standalone-verification
          path: build/initial/offline
          run-id: 35278636289
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: detail-regressions-verification
          path: build/initial/regressions
          run-id: 35278636289
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require all reports and immutable image/source hashes
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          root=Path('build/qualified');out=Path('evidence/detail')
          detail=json.loads((root/'detail/evidence/detail/report.json').read_text())
          assert detail['result']=='PASS' and not detail['errors'] and detail['entrypoint']=='localhost HTTP'
          assert detail['geometry']=={'triangles':5029800,'vertices':2526592} and detail['detail']['resolution']==4096
          assert len(detail['checks'])>=63 and len(detail['captures'])==16
          assert detail['captures']['native_dpr3']['size']==[1170,2532]
          assert detail['export4k']['report']['width']==3840 and detail['export4k']['report']['height']==2560 and detail['export4k']['report']['samples']==8 and not detail['export4k']['report']['upscaled']
          assert detail['actual_fragment_sha256']=='b496f4df5699889455eadbde456a145a93847809b825c102ad2ebbdac6c97ddb'
          for name,e in detail['captures'].items():assert sha(root/'detail/evidence/detail'/(name+'.png'))==e['sha256'] and e['glError']==0,name
          assert sha(root/'detail/evidence/detail/hero_4k.png')==detail['export4k']['sha256']
          shutil.copytree(root/'detail/evidence/detail',out,dirs_exist_ok=True)
          for p in (root/'detail/media').iterdir():shutil.copyfile(p,Path('media')/p.name)
          media=json.loads((out/'media.json').read_text());assert media['result']=='PASS' and media['gif_distinct_frames']==48
          for name,h in media['files'].items():assert sha(Path(name))==h,name
          reg=root/'regressions'
          for folder in ['browser','mobile','solid_browser','material-field']:
              report=json.loads((reg/folder/'report.json').read_text());assert report['result']=='PASS' and not report.get('errors'),folder
              if folder=='mobile':assert report['scene_rendering_verified'] and not report['controls_only']
              dest=out/'regression'/folder;dest.mkdir(parents=True,exist_ok=True);shutil.copyfile(reg/folder/'report.json',dest/'report.json')
          changes=json.loads((reg/'repaired-tests/changes.json').read_text());assert len(changes)==3
          intake=json.loads((out/'source_intake.json').read_text())['files']
          for e in changes:
              name=e['file'];assert name in ['tools/browser_smoke.py','tools/mobile_controls_smoke.py','tools/test_solid_browser.py']
              assert e['before_sha256']==intake[name] and sha(Path(name))==e['before_sha256']
              source=reg/'repaired-tests'/Path(name).name;assert sha(source)==e['after_sha256']
              before=Path(name).read_text();after=source.read_text()
              old="'--disable-gpu-sandbox']" if name.endswith('test_solid_browser.py') else "'--disable-dev-shm-usage']"
              new="'--disable-gpu-sandbox','--disable-gpu-watchdog']" if name.endswith('test_solid_browser.py') else "'--disable-dev-shm-usage','--ignore-gpu-blocklist','--disable-gpu-watchdog']"
              assert before.count(old)==1 and after==before.replace(old,new,1)
              shutil.copyfile(source,name)
          shutil.copyfile(reg/'repaired-tests/changes.json',out/'software_gpu_test_flags.json')
          sr=root/'offline/build/detail-standalone';report=json.loads((sr/'report.json').read_text())
          assert report['result']=='PASS' and not report['errors'] and len(report['deliveries'])==2
          for e in report['deliveries']:
              assert not e['external_requests'] and not e['asset_requests'] and e['state']['glError']==0
              assert e['state']['triangles']==5029800 and e['state']['vertices']==2526592
              for i,h in enumerate(e['image_sha256']):assert sha(sr/(str(e['state']['maps'])+'_'+str(i)+'.png'))==h
          shutil.copytree(sr,out/'offline',dirs_exist_ok=True)
          shutil.copyfile('build/initial/offline/build/detail-standalone/report.json',out/'initial_offline_capture_failure.json')
          shutil.copyfile('build/initial/regressions/build/browser/report.json',out/'initial_software_gpu_context_failure.json')
          (out/'qualified_ci.json').write_text(json.dumps({'result':'PASS','publication_run_id':os.environ['GITHUB_RUN_ID'],'input_commit':os.environ['GITHUB_SHA'],
              'detail_render_run_id':35278636289,'offline_render_run_id':35279262293,'navigation_render_run_id':35279475963,
              'source_mesh_sha256':detail['source_mesh_sha256'],'renderer':detail['renderer'],'detail_checks':len(detail['checks']),
              'browser_http_entrypoint_verified':True,'full_and_compact_standalone_verified':True,
              'original_geometry_bake_and_controls_unchanged':True,'fresh_spectral_bake':False,'physical_phone_benchmark':False,
              'harness_corrections':'Atomic canvas capture and explicit Mesa software-GPU launch flags; runtime renderer, inputs and assertion thresholds unchanged',
              'prior_failures_preserved':True},indent=2)+'\n')
          PY
      - name: Rebuild and verify byte-identical tested offline files
        run: |
          python tools/make_standalone.py
          python tools/make_standalone.py --texture-size 2048 --out dist/Sandstone_Walk_Compact.html
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          for e in json.loads(Path('evidence/detail/offline/report.json').read_text())['deliveries']:
              p=Path('dist')/e['filename'];assert p.stat().st_size==e['bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==e['sha256']
          PY
      - name: Commit qualified source, maps, current movie and provenance
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          names=list(json.loads(Path('evidence/detail/source_intake.json').read_text())['files'])
          names+=['web/detail','web/scene.json','web/bootstrap.js','evidence/detail','evidence/solid_validation.json','media/sandstone-detail.gif','media/sandstone-detail.mp4']
          subprocess.run(['git','add','-f','--',*names],check=True)
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          omit={'SHA256SUMS.json'}|{'.github/workflows/'+name for name in ['detail-workspace.yml','detail-intake.yml','detail-qualify.yml','detail-finalize.yml','detail-regression-repair.yml','detail-release.yml']}
          result={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sorted(paths) if name and name not in omit and Path(name).is_file()}
          Path('SHA256SUMS.json').write_text(json.dumps(result,indent=2)+'\n');subprocess.run(['git','add','SHA256SUMS.json'],check=True)
          PY
          python tools/check_manifest.py
          git diff --cached --exit-code -- web/assets source/cybr-geo source/solid_geometry.py source/material_field.glsl web/vendor web/controls.js web/controls.css 'web/*.glsl' media/sandstone-walk.gif media/sandstone-walk.mp4 .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish verified 4K photographic surfaces, native screen pixels, HDR antialiasing and geometric sun shadows'
          git push origin HEAD:feat/scanned-surface-detail
          echo "QUALIFIED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish complete v0.5.0 downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip HEAD -- . ':!.github/workflows/detail-workspace.yml' ':!.github/workflows/detail-intake.yml' ':!.github/workflows/detail-qualify.yml' ':!.github/workflows/detail-finalize.yml' ':!.github/workflows/detail-regression-repair.yml' ':!.github/workflows/detail-release.yml' > dist/Sandstone_Walk_Project.zip
          sha256sum dist/*.html dist/Sandstone_Walk_Project.zip > dist/SHA256SUMS.txt
          gh release create v0.5.0 --target "$QUALIFIED_COMMIT" --title 'Sandstone Walk 0.5.0 — Photographic detail and native resolution' --notes-file docs/RELEASE_NOTES.md --latest
          gh release upload v0.5.0 dist/Sandstone_Walk_Standalone.html dist/Sandstone_Walk_Compact.html dist/Sandstone_Walk_Project.zip dist/SHA256SUMS.txt
