name: Qualify preserved material bake
on:
  push:
    branches: [fix/surface-mapping]
    paths: [.github/workflows/material-qualify.yml]
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reviewed source and test-frame synchronization
        env:
          SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-7830-81f5-9398-66ba982bbcb9/raw?se=2026-09-17T18%3A04%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=34a0ae98-90f2-507c-993a-850ae4affcf7&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T20%3A14%3A52Z&ske=2026-09-17T20%3A14%3A52Z&sks=b&skv=2026-02-06&sig=qZ06BTiY0QtIB6CTSzawlxJTWs1RI1HA572XBJtxWiQ%3D'
        run: |
          curl --fail --location --retry 2 --silent --show-error "$SOURCE_URL" -o "$RUNNER_TEMP/source.zip"
          echo "4c1513843e9c23f5790b75fcc0510a3bee8c0cb30882e2626b9b0aff500a1bd6  $RUNNER_TEMP/source.zip" | sha256sum --check
          python - <<'PY'
          import hashlib,json,os,stat,zipfile,shutil
          from pathlib import Path
          stage=Path(os.environ['RUNNER_TEMP'])/'source';stage.mkdir()
          with zipfile.ZipFile(stage.parent/'source.zip') as z:
              entries=z.infolist();assert len({e.filename for e in entries})==len(entries)
              for e in entries:
                  p=Path(e.filename);assert not p.is_absolute() and not {'..','.git','.github'}&set(p.parts)
                  assert not stat.S_ISLNK(e.external_attr>>16)
              z.extractall(stage)
          m=json.loads((stage/'MATERIAL_SOURCE_MANIFEST.json').read_text());sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          for p,h in m['source_files'].items():assert sha(stage/p)==h,p
          for p,h in m['base_files'].items():assert (not Path(p).exists()) if h is None else sha(Path(p))==h,p
          for name in m['source_files']:
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(stage/name,p)
          Path('material-source-intake.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: material-generated-checkpoint
          path: build/checkpoint
          run-id: 35253810162
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: material-mapping-verification
          path: build/previous
          run-id: 35253810162
          github-token: ${{ github.token }}
      - name: Restore completed bake and distinguish prior desktop pass from mobile timeout
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          root=Path.cwd();cp=Path('build/checkpoint')
          for directory in ['web','evidence','dist']:shutil.copytree(cp/directory,root/directory,dirs_exist_ok=True)
          shutil.copyfile(cp/'verification.json','verification.json')
          out=Path('evidence/materials')
          shutil.copyfile('material-source-intake.json',out/'qualification_source_intake.json')
          previous=Path('build/previous/build/browser');r=json.loads((previous/'report.json').read_text())
          assert r['result']=='PASS' and r['browser_runtime_verified'] and not r['errors']
          assert r['geometry']['triangles']==5029800 and r['geometry']['vertices']==2526592
          for n,d in r['captures'].items():
              assert hashlib.sha256((previous/(n+'.png')).read_bytes()).hexdigest()==d['sha256']
              assert d['gl_error']==0 and d['drawn_triangles']==5029800
          shutil.copytree(previous,out/'desktop_ci',dirs_exist_ok=True)
          shutil.copyfile('build/previous/build/mobile/report.json',out/'initial_mobile_timeout.json')
          shutil.copyfile('build/checkpoint/build/material-field/report.json',out/'material_field_webgl.json')
          proof={'bake_run_id':35253810162,'bake_checkpoint_artifact':10511997729,'prior_desktop_artifact':10512425460,
            'desktop_runtime_verified':True,'prior_mobile_result':'TIMEOUT; not counted as pass',
            'current_runtime_app_and_shader_changes':False,
            'test_change':'Synchronize actual application frames with gl.finish and 120ms pacing on software GPU; input assertions and final capture resolutions unchanged.'}
          (out/'checkpoint_reuse.json').write_text(json.dumps(proof,indent=2)+'\n')
          expected='49f7c058588d425426fcc55ddaf8f443337b1f97df1b2686d6a57fc2c400a924'
          assert hashlib.sha256(Path('dist/Sandstone_Walk_Standalone.html').read_bytes()).hexdigest()==expected
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check exact geometry, shader coherence and standalone identity
        run: |
          python -m pip install -r tools/requirements-test.txt
          python tools/verify.py
          python tools/build_material_shaders.py
          python tools/make_standalone.py
          echo '49f7c058588d425426fcc55ddaf8f443337b1f97df1b2686d6a57fc2c400a924  dist/Sandstone_Walk_Standalone.html' | sha256sum --check
          git diff --exit-code -- source/solid_geometry.py source/cybr-geo web/controls.js web/controls.css web/vendor media .github
      - name: Archive complete candidate for independent browser workers
        run: |
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path.cwd();output=Path(os.environ['RUNNER_TEMP'])/'candidate.zip'
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for p in root.rglob('*'):
                  rel=p.relative_to(root)
                  if not p.is_file() or p.is_symlink() or rel.parts[0] in ['.git','build','dist'] or '__pycache__' in rel.parts:continue
                  z.write(p,rel.as_posix())
          Path(os.environ['RUNNER_TEMP'],'candidate.sha256').write_text(hashlib.sha256(output.read_bytes()).hexdigest()+'  candidate.zip\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: material-review-candidate
          compression-level: 0
          retention-days: 3
          path: |
            ${{ runner.temp }}/candidate.zip
            ${{ runner.temp }}/candidate.sha256
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test: [mobile, views]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: material-review-candidate
          path: ${{ runner.temp }}/candidate
      - name: Restore exact candidate
        run: |
          cd "$RUNNER_TEMP/candidate" && sha256sum --check candidate.sha256
          python -m zipfile -e "$RUNNER_TEMP/candidate/candidate.zip" "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install actual browser
        run: |
          python -m pip install -r tools/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Execute actual scene and unchanged assertions
        env:
          TEST: ${{ matrix.test }}
        run: |
          if [ "$TEST" = mobile ]; then
            python tools/mobile_controls_smoke.py --out build/test-result
          else
            python tools/test_solid_browser.py --materials --out build/test-result
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-${{ matrix.test }}-verification
          path: build/test-result/
          if-no-files-found: warn
  publish:
    needs: [prepare, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: material-review-candidate
          path: ${{ runner.temp }}/candidate
      - name: Restore tested candidate
        run: |
          cd "$RUNNER_TEMP/candidate" && sha256sum --check candidate.sha256
          python -m zipfile -e "$RUNNER_TEMP/candidate/candidate.zip" "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: material-mobile-verification
          path: evidence/materials/mobile_ci
      - uses: actions/download-artifact@v4
        with:
          name: material-views-verification
          path: evidence/materials/browser_ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify every result and preserve provenance
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          p=Path('evidence/materials');mat=json.loads((p/'material_field_webgl.json').read_text())
          desktop=json.loads((p/'desktop_ci/report.json').read_text());mobile=json.loads((p/'mobile_ci/report.json').read_text())
          after=json.loads((p/'browser_ci/report.json').read_text());before=json.loads((p/'before_browser/report.json').read_text())
          assert mat['result']=='PASS' and not mat['errors']
          assert desktop['result']=='PASS' and desktop['browser_runtime_verified'] and not desktop['errors']
          assert mobile['result']=='PASS' and mobile['scene_rendering_verified'] and not mobile['controls_only'] and not mobile['errors']
          assert after['result']=='PASS' and after['browser_runtime_verified'] and not after['errors']
          assert len(after['captures'])==18 and len(before['captures'])==10
          assert after['source_mesh_sha256']==before['source_mesh_sha256']=='7522cf1848ef94af2593e4a2d2a9df382df11c2e85e9ac4662a364a107656c79'
          assert after['material_field_sha256']==mat['material_field_sha256']
          for name,entry in after['captures'].items():
              assert entry['gl_error']==0 and entry['triangles_drawn']==5029800
              assert hashlib.sha256((p/'browser_ci'/(name+'.png')).read_bytes()).hexdigest()==entry['sha256']
          for name in ['hero','forward','reverse','left_close_beauty','right_close_beauty','ground_beauty','talus_beauty','orbit']:
              assert after['captures'][name]['camera']==before['captures'][name]['camera'],name
          shutil.copyfile(p/'desktop_ci/report.json',p/'desktop_report.json');shutil.copyfile(p/'mobile_ci/report.json',p/'mobile_report.json')
          (p/'qualified_ci.json').write_text(json.dumps({'result':'PASS','run_id':os.environ['GITHUB_RUN_ID'],
              'input_commit':os.environ['GITHUB_SHA'],'native_bake_run_id':35253810162,
              'source_mesh_sha256':after['source_mesh_sha256'],'material_field_sha256':mat['material_field_sha256'],
              'browser_runtime_verified':True,'before_capture_run_id':35251677406,
              'before_after_camera_poses_preserved':True,'frozen_geometry_restoration_verified':True,
              'test_frame_pacing':'gl.finish after real frames; no changes to shaders, application or control assertions',
              'physical_phone_benchmark':False},indent=2)+'\n')
          v=json.loads(Path('verification.json').read_text());v['browser_runtime_verified']=True;Path('verification.json').write_text(json.dumps(v,indent=2)+'\n')
          PY
          python tools/make_standalone.py
          echo '49f7c058588d425426fcc55ddaf8f443337b1f97df1b2686d6a57fc2c400a924  dist/Sandstone_Walk_Standalone.html' | sha256sum --check
          cp dist/Sandstone_Walk_Standalone.json evidence/materials/standalone.json
      - name: Commit only tested changes
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          intake=json.loads(Path('material-source-intake.json').read_text())
          paths=list(intake['source_files'])+['web/assets','web/scene.json','web/bootstrap.js','web/surface.vert.glsl','web/surface.frag.glsl','verification.json','evidence/materials','evidence/solid_validation.json']
          subprocess.run(['git','add','-f','--',*paths],check=True)
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          omit={'SHA256SUMS.json','.github/workflows/material-workspace.yml','.github/workflows/material-integrate.yml','.github/workflows/material-qualify.yml'}
          manifest={n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in sorted(names) if n and n not in omit and Path(n).is_file()}
          Path('SHA256SUMS.json').write_text(json.dumps(manifest,indent=2)+'\n');subprocess.run(['git','add','SHA256SUMS.json'],check=True)
          PY
          python tools/check_manifest.py
          git diff --cached --exit-code -- source/solid_geometry.py source/cybr-geo web/controls.js web/controls.css web/vendor media .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix stretched material with per-fragment metre-space shading, preserved geometry and freshly verified spectral response bake'
          git push origin HEAD:fix/surface-mapping
          echo "QUALIFIED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish versioned current viewer and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=zip HEAD -- . ':!.github/workflows/material-workspace.yml' ':!.github/workflows/material-integrate.yml' ':!.github/workflows/material-qualify.yml' > dist/Sandstone_Walk_Project.zip
          sha256sum dist/Sandstone_Walk_Standalone.html dist/Sandstone_Walk_Project.zip > dist/SHA256SUMS.txt
          gh release create v0.4.0 --target "$QUALIFIED_COMMIT" --title 'Sandstone Walk 0.4.0 — World-space materials' --notes-file docs/RELEASE_NOTES.md --latest
          gh release upload v0.4.0 dist/Sandstone_Walk_Standalone.html dist/Sandstone_Walk_Project.zip dist/Sandstone_Walk_Standalone.json dist/SHA256SUMS.txt
