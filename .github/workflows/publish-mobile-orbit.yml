name: Publish mobile and orbit release
on:
  push:
    branches: [master]
    paths: ['.github/workflows/publish-mobile-orbit.yml']
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4fd1083f987281770150ec85250b975b4811050f
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify reviewed tree and clean-runner result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = 4fd1083f987281770150ec85250b975b4811050f
          git diff --exit-code f6dd2c0637813a5f6a6ecbb86e0f1f6862174641 HEAD
          test "$(gh api repos/cybrdelic/sandstone-walk/actions/runs/35187591508 --jq .conclusion)" = success
          python tools/check_manifest.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/mobile_controls_ci/report.json').read_text())
          assert r['result']=='PASS' and r['scene_rendering_verified'] and not r['controls_only']
          assert not r['errors'] and 'exception' not in r and len(r['captures'])==3
          assert all(x['gl_error']==0 and x['drawn_triangles']==8108728 for x in r['captures'])
          assert json.loads(Path('package.json').read_text())['version']=='0.2.0'
          PY
      - name: Build and verify current standalone viewer
        run: |
          python tools/make_standalone.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected=json.loads(Path('evidence/mobile_controls_ci/standalone.json').read_text())
          p=Path('dist/Sandstone_Walk_Standalone.html')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==expected['sha256']
          assert p.stat().st_size==expected['bytes']
          PY
          git archive --format=zip HEAD -o dist/Sandstone_Walk_Project.zip
          sha256sum dist/Sandstone_Walk_Standalone.html dist/Sandstone_Walk_Project.zip > dist/SHA256SUMS.txt
      - name: Publish v0.2.0 at the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 --target 4fd1083f987281770150ec85250b975b4811050f --title 'Sandstone Walk 0.2.0 — Mobile and orbit controls' --notes-file docs/RELEASE_NOTES.md --latest
          gh release upload v0.2.0 dist/Sandstone_Walk_Standalone.html dist/Sandstone_Walk_Project.zip dist/Sandstone_Walk_Standalone.json dist/SHA256SUMS.txt
